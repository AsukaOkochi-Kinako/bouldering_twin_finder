<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <meta name="robots" content="noindex">
  <title>ガイドOGP画像のもと</title>
  <!-- ogp-guide.png を作るためのページ。Chrome のヘッドレスモードで 1200x630 をスクリーンショットする -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ogp.css">
</head>
<body>
  <div class="card card--guide" data-confetti="7">
    <div class="confetti"></div>

    <div class="text">
      <p class="kicker">BEGINNER'S&nbsp;&nbsp;GUIDE</p>
      <h1 class="title title--guide">
        <span class="c-pink">ボ</span><span class="c-yellow">ル</span><span class="c-blue">ダ</span><span class="c-green">リ</span><span class="c-orange">ン</span><span class="c-teal">グ</span>の<br>
        <span class="outline">楽しみ方</span>
      </h1>
      <p class="latin">Ganba<em>!</em></p>
      <p class="lead">声かけ・用語・グレードの見方がわかる！</p>
    </div>

    <div class="stage">
      <div class="blob"></div>
      <p class="say say--1">ガンバ！</p>
      <p class="say say--2">ナイス！</p>
      <div class="fig fig--1" data-seed="11" data-pose="reach"></div>
      <div class="fig fig--2" data-seed="57" data-pose="dyno"></div>
      <div class="fig fig--3" data-seed="91" data-pose="dance" data-detached></div>
      <div class="fig fig--4" data-seed="74" data-pose="heel"></div>
    </div>
  </div>

  <script src="../figures.js"></script>
  <script src="ogp.js"></script>
</body>
</html>
